# Kiểm thử thật trên Windows và macOS mỗi khi đẩy code lên GitHub:
# cài từ đầu như máy người dùng mới (npm + scripts/setup.js) rồi chạy toàn bộ bộ test.
name: CI Windows + macOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài thư viện Node (kèm ffmpeg đúng hệ điều hành)
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Bộ nhớ đệm model AI & Python (tăng tốc lần chạy sau)
        uses: actions/cache@v4
        with:
          path: |
            bin/models
            bin/tools/python
            ~/QwenLocal
            QwenLocal
          key: ai-${{ runner.os }}-${{ hashFiles('requirements/*.txt', 'src/tool_installer.js', 'src/python_env.js', 'src/qwen_shared_home.js') }}

      # Máy kiểm thử cài TẤT CẢ thành phần (--all). Máy CI macOS chỉ có 7 GB RAM, không chạy nổi Qwen 9B
      # (app cũng khuyến nghị không cài khi RAM < 15 GB) → bỏ Qwen trên macOS; Windows (16 GB) vẫn cài Qwen.
      - name: Cài thành phần AI (Python 3.12, model) như máy mới
        run: node scripts/setup.js --all ${{ runner.os == 'macOS' && '--no-llm' || '' }}

      - name: Kiểm tra cài đặt
        run: node scripts/setup.js --check

      - name: Chạy toàn bộ test
        run: npm test

      # Đúng thao tác người dùng: nhấp đúp Start_App_Windows.bat → máy chủ chạy → giao diện + API phản hồi
      - name: Khởi động bằng Start_App_Windows.bat và kiểm tra giao diện (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath cmd.exe -ArgumentList '/c', 'Start_App_Windows.bat' -PassThru -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            try { if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3889/api/health).StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          if (-not $ok) { throw 'Ứng dụng không phản hồi /api/health sau 180 giây' }
          $page = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3889/
          if ($page.Content -notmatch 'app\.js') { throw 'Không tải được giao diện (index.html)' }
          $cat = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3889/api/tools/catalog).Content | ConvertFrom-Json
          $tools = if ($cat.tools) { $cat.tools } else { $cat }
          $tools | ForEach-Object { Write-Host ("{0,-20} {1}" -f $_.id, $(if ($_.installed) { 'đã cài' } else { 'CHƯA CÀI' })) }
          # localAsrSmall (Whisper) chỉ còn là tùy chọn, setup không cài mặc định (đã thay bằng SenseVoice)
          $missing = @($tools | Where-Object { -not $_.installed -and $_.id -ne 'localAsrSmall' })
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process CNVideoScraperPro, node, llama-server -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if ($missing.Count -gt 0) { throw ("Còn thiếu: " + (($missing | ForEach-Object { $_.id }) -join ', ')) }
          Write-Host 'OK: Start_App_Windows.bat mở được ứng dụng, giao diện + API phản hồi, đủ công cụ'

      # "Ứng dụng khác" chỉ biết thư mục user: đọc %USERPROFILE%\QwenLocal\qwen-local.json → bật máy chủ → dịch thử 1 câu
      - name: Qwen dùng chung — ứng dụng khác tìm & chạy qua qwen-local.json (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mf = Join-Path $env:USERPROFILE 'QwenLocal\qwen-local.json'
          if (-not (Test-Path $mf)) { throw "Không có $mf" }
          $m = Get-Content $mf -Raw -Encoding UTF8 | ConvertFrom-Json
          $home2 = $m.home
          $free = [math]::Round((Get-PSDrive C).Free / 1GB, 1)
          Write-Host "Ổ C còn $free GB • Qwen nằm ở: $home2" 
          $exe = Join-Path $home2 $m.runtime.server
          $gguf = Join-Path $home2 $m.model.file
          if (-not (Test-Path $exe)) { throw "Thiếu bộ chạy $exe" }
          if ((Get-Item $gguf).Length -ne $m.model.sizeBytes) { throw "Model sai kích thước: $gguf" }
          if (-not (Test-Path (Join-Path $home2 'Start_Qwen_Server.bat'))) { throw 'Thiếu Start_Qwen_Server.bat' }
          if ($home2.StartsWith($PWD.Path)) {
            Write-Host "OK: Qwen nằm trong thư mục ứng dụng ($home2) — không cần lối tắt"
          } else {
            $lnk = Join-Path $PWD 'Qwen Local.lnk'
            if (-not (Test-Path $lnk)) { throw 'Thiếu lối tắt Qwen Local.lnk trong thư mục ứng dụng' }
            $t = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
            if ($t -ne $home2) { throw "Lối tắt trỏ sai: $t" }
            Write-Host "OK: manifest + model + bộ chạy + lối tắt → $t"
          }
          $p = Start-Process -FilePath cmd.exe -ArgumentList '/c', (Join-Path $home2 'Start_Qwen_Server.bat'), '8799' -PassThru -WindowStyle Hidden
          $ready = $false
          for ($i = 0; $i -lt 150; $i++) { Start-Sleep -Seconds 2; try { if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/health).StatusCode -eq 200) { $ready = $true; break } } catch {} }
          if (-not $ready) { Get-Process llama-server -ErrorAction SilentlyContinue | Stop-Process -Force; throw 'Máy chủ Qwen không sẵn sàng sau 300 giây' }
          $body = @{ messages = @(@{ role = 'system'; content = 'Dịch câu tiếng Trung sang tiếng Việt. Chỉ trả về bản dịch.' }, @{ role = 'user'; content = '大家好，欢迎来到我的频道。' }); max_tokens = 64; temperature = 0.2 } | ConvertTo-Json -Depth 5
          $r = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8799/v1/chat/completions -ContentType 'application/json; charset=utf-8' -Body ([System.Text.Encoding]::UTF8.GetBytes($body)) -TimeoutSec 600
          $text = $r.choices[0].message.content
          Get-Process llama-server -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $text) { throw 'Không nhận được bản dịch' }
          Write-Host "OK: ứng dụng khác gọi Qwen dùng chung → $text"

      - name: Tạo lối tắt Desktop (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmd /c Tao_Shortcut_Desktop.bat --quiet
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'CN Video Scraper Pro.lnk'
          if (-not (Test-Path $lnk)) { throw "Không tạo được $lnk" }
          $t = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
          if ($t -notmatch 'Start_App_Windows\.bat$') { throw "Lối tắt trỏ sai: $t" }
          Write-Host "OK: lối tắt Desktop → $t"
