# Kiểm thử thật trên Windows và macOS mỗi khi đẩy code lên GitHub:
# cài từ đầu như máy người dùng mới (npm + scripts/setup.js) rồi chạy toàn bộ bộ test.
name: CI Windows + macOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài thư viện Node (kèm ffmpeg đúng hệ điều hành)
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Bộ nhớ đệm model AI & Python (tăng tốc lần chạy sau)
        uses: actions/cache@v4
        with:
          path: |
            bin/models
            bin/tools/python
            bin/tools/llama.cpp
          key: ai-${{ runner.os }}-${{ hashFiles('requirements/*.txt', 'src/tool_installer.js', 'src/python_env.js') }}

      # Windows: cài cả AI dịch Local Qwen3.5 9B (llama.cpp, chạy CPU trên máy CI) — giống máy người dùng
      - name: Cài thành phần AI (Python 3.12, model) như máy mới
        run: node scripts/setup.js --yes

      - name: Kiểm tra cài đặt
        run: node scripts/setup.js --check

      - name: Chạy toàn bộ test
        run: npm test

      # Đúng thao tác người dùng: nhấp đúp Start_App_Windows.bat → máy chủ chạy → giao diện + API phản hồi
      - name: Khởi động bằng Start_App_Windows.bat và kiểm tra giao diện (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath cmd.exe -ArgumentList '/c', 'Start_App_Windows.bat' -PassThru -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            try { if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3889/api/health).StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          if (-not $ok) { throw 'Ứng dụng không phản hồi /api/health sau 180 giây' }
          $page = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3889/
          if ($page.Content -notmatch 'app\.js') { throw 'Không tải được giao diện (index.html)' }
          $cat = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3889/api/tools/catalog).Content | ConvertFrom-Json
          $tools = if ($cat.tools) { $cat.tools } else { $cat }
          $tools | ForEach-Object { Write-Host ("{0,-20} {1}" -f $_.id, $(if ($_.installed) { 'đã cài' } else { 'CHƯA CÀI' })) }
          $missing = @($tools | Where-Object { -not $_.installed })
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process node, llama-server -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if ($missing.Count -gt 0) { throw ("Còn thiếu: " + (($missing | ForEach-Object { $_.id }) -join ', ')) }
          Write-Host 'OK: Start_App_Windows.bat mở được ứng dụng, giao diện + API phản hồi, đủ công cụ'
